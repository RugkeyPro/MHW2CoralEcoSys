name: Physiology MaxEnt notebook and conservation regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/execute_notebook.py
      - run: python scripts/acquire_full_grid_inputs.py
      - run: python scripts/execute_notebook.py --notebook Physiology_MaxEnt_demo.ipynb --output outputs/notebook_execution/Physiology_MaxEnt_demo.executed.ipynb
      - run: python scripts/verify_full_grid_projection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-scientific-notebook-and-outputs
          path: |
            outputs/notebook_demo/
            outputs/notebook_execution/
            outputs/physiology_maxent_demo/
